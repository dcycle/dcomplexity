faq:
  - question:
      en: "Where can I find this project's source code?"
      fr: "Où puis-je trouver le code source de ce projet?"
    answer:
      en: "On GitHub at <https://github.com/dcycle/dcomplexity>"
      fr: "Sur GitHub à <https://github.com/dcycle/dcomplexity>"
  - question:
      en: "What is the URL of this project?"
      fr: "Quelle est l'URL de ce projet?"
    answer:
      en: "<https://dcomplexity.org>"
      fr: "<https://dcomplexity.org/fr/>"
  - question:
      en: "How can I build this website locally?"
      fr: "Comment puis-je développer ce site Web localement?"
    answer:
      en: "`docker compose up` and then visit <http://localhost:4331>"
      fr: "`docker compose up` puis visitez <http://localhost:4331>"
  - question:
      en: "How can I test my own code with PHPMetrics?"
      fr: "Comment puis-je tester mon propre code avec PHPMetrics?"
    answer:
      en: 'Put your code in a directory called `./my-code` and then run `docker run -v "$(pwd)":/my --rm composer /bin/bash -c "composer require phpmetrics/phpmetrics && ./vendor/bin/phpmetrics --report-html=myreport /my/my-code && mv myreport /my/my-report"`'
      fr: 'Mettez votre code dans un répertoire appelé `./my-code` puis exécutez `docker run -v "$(pwd)":/my --rm composer /bin/bash -c "composer require phpmetrics/phpmetrics && ./vendor/bin/phpmetrics --report-html=myreport /my/my-code && mv myreport /my/my-report"`'
  - question:
      en: "How can I suggest a Drupal module to be added?"
      fr: "Comment puis-je suggérer un module Drupal à ajouter?"
    answer:
      en: 'Add a pull request to <https://github.com/dcycle/dcomplexity> suggesting the module on the file ./docs/_data/projects.yml.'
      fr: 'Ajoutez une demande de fusion ("pull request") à <https://github.com/dcycle/dcomplexity> suggérant le module dans le fichier ./docs/_data/projects.yml.'
  - question:
      en: "How often is the website updated?"
      fr: "À quelle fréquence le site Web est-il mis à jour?"
    answer:
      en: 'Not often!'
      fr: 'Pas souvent!'
  - question:
      en: "If I add a module to ./docs/_data/projects.yml, how can I update the website to include it?"
      fr: "Si j'ajoute un module à ./docs/_data/projects.yml, comment puis-je mettre à jour le site Web pour l'inclure?"
    answer:
      en: '`./scripts/run.sh`'
      fr: '`./scripts/run.sh`'
  - question:
      en: "Are you associated with the techno-jungle artist Dcomplexity?"
      fr: "Êtes-vous associé à l'artiste techno-jungle Dcomplexity?"
    answer:
      en: "No! I hadn't event heard of him until today. He's not bad, you should check him out."
      fr: "Non! Je n'avais même pas entendu parler de lui jusqu'à aujourd'hui. Il n'est pas mal, vous devriez l'écouter."
  - question:
      en: "How can I interpret the metrics shown on this website?"
      fr: "Comment puis-je interpréter les métriques affichées sur ce site Web?"
    answer:
      en: "<https://phpmetrics.github.io/website/metrics/>"
      fr: "<https://phpmetrics.github.io/website/metrics/>"
  - question:
      en: "How can I contact you?"
      fr: "Comment puis-je vous contacter?"
    answer:
      en: "Via LinkedIn at <https://www.linkedin.com/in/albertalbala>"
      fr: "Via LinkedIn à <https://www.linkedin.com/in/albertalbala>"
  - question:
      en: "Do you have a slideshow about this, ideally in French?"
      fr: "Avez-vous un diaporama à ce sujet?"
    answer:
      en: "Glad you asked: see [here](https://docs.google.com/presentation/d/1p8Q6o6BIO21iS1-iLzHOB8d6QN1G2TYk_z4XM8Bj-2I/edit?slide=id.g3a9c5af0fda_0_65#slide=id.g3a9c5af0fda_0_65)"
      fr: "Content que vous ayez demandé: voir [ici](https://docs.google.com/presentation/d/1p8Q6o6BIO21iS1-iLzHOB8d6QN1G2TYk_z4XM8Bj-2I/edit?slide=id.g3a9c5af0fda_0_65#slide=id.g3a9c5af0fda_0_65)"
  - question:
      en: "Who made the preview image on social media posts?"
      fr: "Qui a réalisé l'image d'aperçu sur les publications des réseaux sociaux?"
    answer:
      en: "I prompted ChatGTP with 'I have a website where I run several open source PHP projects through PHPMetrics, a tool to determine their relative code complexity. I need to have a preview image for that, can you make one? It shouldn't look like stock photography and should be rather sober, and contain no text'. So much for 'contain no text'!"
      fr: "J'ai demandé à ChatGTP 'I have a website where I run several open source PHP projects through PHPMetrics, a tool to determine their relative code complexity. I need to have a preview image for that, can you make one? It shouldn't look like stock photography and should be rather sober, and contain no text'. Pas mal, mais il semble pas avoir compris 'contain no text' !"
